[fujinet]
build_board    = fujibus-link-uart-log-fujimac-rev0

[env]
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; FujiNet Mac board: the RP2040 on the Mac's floppy port is a packet-link
; controller (docs/packet_link.md) on a 2 Mbaud UART; see docs/build_profiles.md
; for the channel settings it needs.
[env:fujibus-link-uart-log-fujimac-rev0]
platform = espressif32@${fujinet.esp32_platform_version}
platform_packages = ${fujinet.esp32_platform_packages}
board = fujimac-rev0-8mb
build_type = debug
build_flags =
    ${env.build_flags}
    -DFN_BUILD_ESP32_FUJIBUS_LINK_UART
    -DFN_PLATFORM_ESP32
    -DFN_PINMAP_DEFAULT=FN_PINMAP_FUJIMAC_REV0
board_build.cmake_extra_args = -D CONFIG_IDF_TARGET_ESP32=1
