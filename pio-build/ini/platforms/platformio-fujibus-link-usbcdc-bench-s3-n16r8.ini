[fujinet]
build_board = fujibus-link-usbcdc-bench-s3-n16r8
console_type = consolecdc

[env:fujibus-link-usbcdc-bench-s3-n16r8]
platform = espressif32@${fujinet.esp32s3_platform_version}
platform_packages = ${fujinet.esp32s3_platform_packages}
board = nosd-esp32-s3-wroom-1-n16r8
build_type = debug
build_flags =
    ${env.build_flags}
    -DFN_BUILD_ESP32_USB_CDC_LINK
    -DFN_PLATFORM_ESP32S3
    -DFN_PINMAP=FN_PINMAP_USB_BENCH

; Add this to delay start with a 5s delay, and 5s countdown
;     -DFN_DEBUG_BOOT_COUNTDOWN

board_build.cmake_extra_args = -D CONFIG_IDF_TARGET_ESP32S3=1
