name: Release boot disks

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  boot-disks:
    runs-on: ubuntu-latest

    env:
      WORKSPACE_DIR: nio-workspace

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/fujinet-nio-workspace
          path: ${{ env.WORKSPACE_DIR }}
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      - name: Checkout release fujinet-nio revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ${{ env.WORKSPACE_DIR }}/repos/fujinet-nio
          submodules: recursive
          fetch-depth: 0

      - name: Checkout fujinet-nio-lib
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/fujinet-nio-lib
          path: ${{ env.WORKSPACE_DIR }}/repos/fujinet-nio-lib
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      - name: Checkout nio-apps
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/nio-apps
          path: ${{ env.WORKSPACE_DIR }}/repos/nio-apps
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      # The MS-DOS and Atari boot disks are built from nio-core-apps, and the
      # BBC boot disk stages the nio-config application.
      - name: Checkout nio-core-apps
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/nio-core-apps
          path: ${{ env.WORKSPACE_DIR }}/repos/nio-core-apps
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      - name: Checkout nio-config
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/nio-config
          path: ${{ env.WORKSPACE_DIR }}/repos/nio-config
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      - name: Checkout fn-rom
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/fn-rom
          path: ${{ env.WORKSPACE_DIR }}/repos/fn-rom
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      - name: Checkout cc65
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/cc65
          ref: bbc-clib
          path: ${{ env.WORKSPACE_DIR }}/repos/cc65
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      # The Atari boot disk's boot sector is built from MyPicoDOS source, at
      # the revision the workspace pins.
      - name: Resolve MyPicoDOS revision
        id: mypicodos
        run: echo "sha=$(git -C "$WORKSPACE_DIR" rev-parse HEAD:repos/MyPicoDOS)" >> "$GITHUB_OUTPUT"

      - name: Checkout MyPicoDOS
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/MyPicoDOS
          ref: ${{ steps.mypicodos.outputs.sha }}
          path: ${{ env.WORKSPACE_DIR }}/repos/MyPicoDOS
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      # The Amiga default disks are built from the driver, nio-core-apps,
      # nio-apps and nio-config.
      - name: Checkout fujinet-nio-driver
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: markjfisher/fujinet-nio-driver
          path: ${{ env.WORKSPACE_DIR }}/repos/fujinet-nio-driver
          fetch-depth: 0
          token: ${{ secrets.NIO_WORKSPACE_TOKEN || github.token }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            dosfstools \
            g++ \
            git \
            mtools \
            python3 \
            python3-venv \
            zip \
            zlib1g-dev

      - name: Build dir2atr
        run: |
          git clone --depth 1 https://github.com/HiassofT/AtariSIO.git /tmp/AtariSIO
          make -C /tmp/AtariSIO/tools -f Makefile.posix
          echo "/tmp/AtariSIO/tools" >> "$GITHUB_PATH"

      # MyPicoDOS assembles with atasm. Pinned so the boot disks don't change
      # with upstream heads.
      - name: Build atasm
        run: |
          # V1.30
          git init -q /tmp/atasm
          git -C /tmp/atasm fetch -q --depth 1 https://github.com/CycoPH/atasm.git \
            46be895a4312205dbcc4cf7a4a6721d72219d711
          git -C /tmp/atasm -c advice.detachedHead=false checkout -q FETCH_HEAD
          make -C /tmp/atasm/src prog
          echo "/tmp/atasm/src" >> "$GITHUB_PATH"

      # The Amiga builds use bebbo's amiga-gcc from /opt/amiga/bin (scripts/env.sh).
      # The pinned image's binaries need a newer glibc than the runner has, so
      # each tool there is a wrapper that runs it in the image, with $HOME (the
      # workspace) and /tmp mounted at the same paths.
      - name: Install amiga-gcc
        env:
          AMIGA_GCC_IMAGE: stefanreinauer/amiga-gcc:gcc-v6.5.0b-20261011@sha256:cafc64bc34a5450d858cf27d6f399222bed241fced3c093123b9ec764a82f26f
        run: |
          docker pull --platform linux/amd64 "$AMIGA_GCC_IMAGE"
          sudo mkdir -p /opt/amiga/bin
          for tool in $(docker run --rm --platform linux/amd64 "$AMIGA_GCC_IMAGE" ls /opt/amiga/bin); do
            sudo tee "/opt/amiga/bin/$tool" > /dev/null <<WRAPPER
          #!/bin/sh
          exec docker run --rm -i --platform linux/amd64 -u "\$(id -u):\$(id -g)" \\
            -v "\$HOME:\$HOME" -v /tmp:/tmp -w "\$PWD" "$AMIGA_GCC_IMAGE" "$tool" "\$@"
          WRAPPER
            sudo chmod +x "/opt/amiga/bin/$tool"
          done
          /opt/amiga/bin/m68k-amigaos-gcc --version

      # scripts/amiga runs the ADF tools (amitools) through uv.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      # fn-rom's SSD builder needs basictool (BBC BASIC tokeniser) and dfstool.
      # Pinned so the boot disks don't change with upstream heads.
      - name: Install BBC disk tools
        run: |
          git -c advice.detachedHead=false clone --depth 1 -b v0.10 \
            https://github.com/ZornsLemma/basictool.git /tmp/basictool
          make -C /tmp/basictool/src
          echo "/tmp/basictool" >> "$GITHUB_PATH"
          cargo install --locked --git https://github.com/rcook/dfstool \
            --rev 4e802d12a1645f5dfc31c7f316fdf58c0310876a

      - name: Build cc65
        working-directory: ${{ env.WORKSPACE_DIR }}/repos/cc65
        run: |
          make -j"$(nproc)"
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Setup Open Watcom
        uses: open-watcom/setup-watcom@v0
        with:
          target: dos

      - name: Build boot disks
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: |
          ./scripts/build.sh boot-disks

      - name: Stage release assets
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          asset_tag="${tag//\//-}"
          mkdir -p build/release-assets
          cp repos/fujinet-nio/distfiles/boot/atari/autorun.atr \
            "build/release-assets/fujinet-nio-${asset_tag}-boot-atari-autorun.atr"
          cp repos/fujinet-nio/distfiles/boot/bbc/FN-BOOT.ssd \
            "build/release-assets/fujinet-nio-${asset_tag}-boot-bbc-FN-BOOT.ssd"
          cp repos/fujinet-nio/distfiles/boot/msdos/autorun.img \
            "build/release-assets/fujinet-nio-${asset_tag}-boot-msdos-autorun.img"
          for profile in wb13 wb31 wb32; do
            adf="$(ls repos/fujinet-nio/distfiles/boot/amiga/$profile/FujiNet-Default-*.adf)"
            cp "$adf" "build/release-assets/fujinet-nio-${asset_tag}-boot-amiga-$(basename "$adf")"
          done
          (
            cd build/release-assets
            sha256sum * > "fujinet-nio-${asset_tag}-boot-disks.sha256"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fujinet-nio-boot-disks-${{ github.event.release.tag_name || inputs.tag }}
          path: ${{ env.WORKSPACE_DIR }}/build/release-assets/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        working-directory: ${{ env.WORKSPACE_DIR }}
        run: |
          gh release upload "$RELEASE_TAG" build/release-assets/* --clobber
