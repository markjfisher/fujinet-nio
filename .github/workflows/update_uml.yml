name: Publish UML diagrams

# All diagrams (the hand-authored docs/uml/arch_* and seq_*, and the
# code-derived gen_*) are rendered in CI and published to GitHub Pages. Nothing
# is committed: the job only publishes when the build and the unit tests pass.
# The page's text and styling live in docs/site/.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'clang-uml.yml'
      - 'docs/uml/**'
      - 'docs/site/**'
      - 'scripts/gen_uml.sh'
      - 'scripts/build_site.py'
      - '.github/workflows/update_uml.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# One publish at a time; a newer push supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Forks have no Pages site of ours to publish to.
    if: github.repository == 'fujinet-nio/fujinet-nio'
    runs-on: ubuntu-24.04  # clang-uml PPA has no amd64v3 index, so 26.04 runners cannot install it
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:bkryza/clang-uml
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 \
            clang-uml \
            graphviz \
            cmake \
            ninja-build \
            build-essential

      # The Ubuntu package is years old (1.2020.02) and rejects current syntax, so
      # use the same pinned release as local development. Java is preinstalled.
      - name: Install PlantUML
        env:
          PLANTUML_VERSION: "1.2026.8"
          PLANTUML_SHA256: 5e1ecfa8ecd32c90b03bbf3b1eb6f020943f98ab0fcf4032be31a0002ee2c462
        run: |
          curl -fsSL -o plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          echo "${PLANTUML_SHA256}  plantuml.jar" | sha256sum -c -
          sudo install -D -m 0644 plantuml.jar /usr/local/share/plantuml/plantuml.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/share/plantuml/plantuml.jar "$@"\n' | sudo tee /usr/local/bin/plantuml >/dev/null
          sudo chmod +x /usr/local/bin/plantuml
          rm plantuml.jar
          plantuml -version | head -1

      # Builds, runs the unit tests (a failure stops the job, so nothing is
      # published from a tree that does not build or pass), then generates.
      - name: Generate UML diagrams
        run: |
          chmod +x scripts/gen_uml.sh
          ./scripts/gen_uml.sh

      # Warns (annotations, never fails the publish) when a hand-authored diagram
      # names a class or function that no longer exists.
      - name: Check hand-authored diagram names
        run: python3 -I scripts/check_uml_names.py

      - name: Assemble the site
        run: |
          python3 scripts/build_site.py --svg-dir build/uml --out site --sha "$GITHUB_SHA"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
